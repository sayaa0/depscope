name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  real-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - name: Compare real npm package versions
        run: node src/cli.js compare zod 3.22.4 4.0.0 --json > smoke.json
      - name: Validate smoke output
        shell: bash
        run: |
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('smoke.json','utf8')); if(r.package!=='zod'||r.from!=='3.22.4'||r.to!=='4.0.0'||!Array.isArray(r.changes)||!Array.isArray(r.breakingChanges)||!Array.isArray(r.compatibleChanges)||!Array.isArray(r.notAnalyzed)) process.exit(1); console.log('changes:', r.changes.length, 'breaking:', r.breakingChanges.length, 'compatible:', r.compatibleChanges.length, 'notAnalyzed:', r.notAnalyzed.length);"
          cat smoke.json

  real-package-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - name: Benchmark representative npm upgrades
        run: node scripts/benchmark.js
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: depscope-benchmark
          path: benchmark.json

  real-consumer-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - name: Checkout real Zod consumer
        uses: actions/checkout@v6
        with:
          repository: alephmatic/full-stack-ai
          ref: f601758736f8ad64c384c25f0f52b1d54c41f779
          path: consumer
      - name: Run impact analysis against real consumer
        run: node src/cli.js impact zod 3.22.4 4.0.0 consumer --json > consumer-impact.json
      - name: Summarize real consumer impact
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('consumer-impact.json', 'utf8'));
          if (!Array.isArray(r.importedSymbols) || !Array.isArray(r.affectedChanges) || !Array.isArray(r.breakingChanges) || !Array.isArray(r.compatibleChanges) || !Array.isArray(r.unrelatedChanges)) process.exit(1);

          const lines = [
            '# DepScope real-consumer impact',
            '',
            'Consumer: `alephmatic/full-stack-ai`',
            '',
            `- Detected package API paths: ${r.importedSymbols.length} (${r.importedSymbols.join(', ') || 'none'})`,
            `- Relevant supported changes: ${r.affectedChanges.length}`,
            `- **Relevant breaking changes: ${r.breakingChanges.length}**`,
            `- Relevant compatible changes: ${r.compatibleChanges.length}`,
            `- Filtered package changes: ${r.unrelatedChanges.length}`,
            `- Unsupported usage patterns: ${r.unsupportedUsage?.length ?? 0}`,
            ''
          ];

          if (r.affectedChanges.length) {
            lines.push('## Relevant changes', '');
            for (const c of r.affectedChanges) {
              const files = (c.files || []).map(f => `\`${f}\``).join(', ') || '-';
              const before = c.before
                ? `${c.before.requiredParams} required / ${c.before.totalParams} total${c.before.hasRest ? ' / rest' : ''}`
                : '-';
              const after = c.after
                ? `${c.after.requiredParams} required / ${c.after.totalParams} total${c.after.hasRest ? ' / rest' : ''}`
                : '-';
              lines.push(`- **\`${c.symbol}\`** — \`${c.compatibility}\` — \`${c.type}\` — files: ${files}`);
              if (c.before || c.after) lines.push(`  - signature: ${before} → ${after}`);
              if (c.reasons?.length) lines.push(`  - reason: ${c.reasons.join(', ')}`);
            }
            lines.push('');
          }

          lines.push(
            r.breakingChanges.length === 0
              ? '> Result: no supported breaking change intersects the API paths detected in this repository.'
              : '> Result: at least one supported breaking change intersects an API path actually used by this repository.',
            ''
          );

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          console.log(JSON.stringify(r, null, 2));
          NODE
      - name: Upload consumer impact result
        uses: actions/upload-artifact@v4
        with:
          name: depscope-real-consumer-impact
          path: consumer-impact.json

  known-breaking-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - name: Checkout consumer with known Zod 3 APIs removed in Zod 4
        uses: actions/checkout@v6
        with:
          repository: qqharry21/my-portfolio-ts
          ref: 0caae5a6ce6e78c95cee899998d1454b614afaf3
          path: breaking-consumer
      - name: Run impact analysis against known breaking consumer
        run: node src/cli.js impact zod 3.23.8 4.0.0 breaking-consumer --json > known-breaking-impact.json
      - name: Assert and summarize detected breaking impact
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('known-breaking-impact.json', 'utf8'));
          if (!Array.isArray(r.breakingChanges) || !Array.isArray(r.compatibleChanges)) process.exit(1);

          const lines = [
            '# DepScope known-breaking consumer',
            '',
            'Consumer: `qqharry21/my-portfolio-ts`',
            '',
            `- Detected package API paths: ${r.importedSymbols.length}`,
            `- Relevant supported changes: ${r.affectedChanges.length}`,
            `- **Relevant breaking changes: ${r.breakingChanges.length}**`,
            `- Relevant compatible changes: ${r.compatibleChanges.length}`,
            `- Filtered package changes: ${r.unrelatedChanges.length}`,
            ''
          ];

          if (r.breakingChanges.length) {
            lines.push('## Breaking changes detected', '');
            for (const c of r.breakingChanges) {
              const files = (c.files || []).map(f => `\`${f}\``).join(', ') || '-';
              lines.push(`- **\`${c.symbol}\`** — \`${c.type}\` — files: ${files}`);
              if (c.reasons?.length) lines.push(`  - reason: ${c.reasons.join(', ')}`);
            }
            lines.push('');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          console.log(JSON.stringify(r, null, 2));

          if (r.breakingChanges.length === 0) {
            console.error('Expected at least one breaking change in the known-breaking consumer.');
            process.exit(1);
          }
          NODE
      - name: Upload known breaking impact result
        uses: actions/upload-artifact@v4
        with:
          name: depscope-known-breaking-impact
          path: known-breaking-impact.json

  compiler-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - name: Checkout known-breaking consumer
        uses: actions/checkout@v6
        with:
          repository: qqharry21/my-portfolio-ts
          ref: 0caae5a6ce6e78c95cee899998d1454b614afaf3
          path: compiler-consumer
      - name: Generate DepScope prediction
        run: node src/cli.js impact zod 3.23.8 4.0.0 compiler-consumer --json > compiler-prediction.json
      - name: Install consumer dependencies
        working-directory: compiler-consumer
        run: npm ci --ignore-scripts
      - name: Replace only Zod with v4
        working-directory: compiler-consumer
        run: npm install --no-save --ignore-scripts --package-lock=false zod@4.0.0
      - name: Run TypeScript compiler and capture expected failure
        shell: bash
        working-directory: compiler-consumer
        run: |
          set +e
          npx tsc --pretty false --noEmit > ../tsc-zod4.log 2>&1
          status=$?
          echo "$status" > ../tsc-zod4.status
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected TypeScript compilation to fail after upgrading this known-breaking consumer to Zod 4.'
            cat ../tsc-zod4.log
            exit 1
          fi
      - name: Compare DepScope prediction with compiler errors
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const prediction = JSON.parse(fs.readFileSync('compiler-prediction.json', 'utf8'));
          const log = fs.readFileSync('tsc-zod4.log', 'utf8');
          const targetLines = log.split(/\r?\n/).filter(line => line.includes('src/lib/zod-error-map.ts'));
          if (targetLines.length === 0) {
            console.error(log);
            throw new Error('Compiler failed, but no error was reported in the DepScope-predicted target file.');
          }

          const predictedNames = prediction.breakingChanges.map(change => change.symbol);
          const leafNames = [...new Set(predictedNames.map(name => name.split('.').at(-1)))];
          const confirmedNames = leafNames.filter(name => log.includes(name));
          const confirmationRate = predictedNames.length
            ? Math.round((confirmedNames.length / predictedNames.length) * 100)
            : 0;

          const lines = [
            '# DepScope vs TypeScript compiler',
            '',
            'Consumer: `qqharry21/my-portfolio-ts`, forced from Zod 3.23.8 to Zod 4.0.0',
            '',
            `- DepScope breaking predictions: **${predictedNames.length}**`,
            `- TypeScript errors in predicted file: **${targetLines.length}**`,
            `- Predicted leaf API names visible in compiler log: **${confirmedNames.length}**`,
            `- Name-level confirmation rate: **${confirmationRate}%**`,
            '',
            '## Compiler errors in predicted file',
            '',
            '```text',
            ...targetLines.slice(0, 80),
            '```',
            ''
          ];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          console.log('Predicted:', predictedNames);
          console.log('Confirmed names:', confirmedNames);

          if (confirmedNames.length === 0) {
            throw new Error('None of the predicted breaking API names appeared in the TypeScript compiler output.');
          }
          NODE
      - name: Upload compiler validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: depscope-compiler-validation
          path: |
            compiler-prediction.json
            tsc-zod4.log
            tsc-zod4.status
